<!DOCTYPE html>

  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: white;
    }

    a.back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: #534AB7;
      text-decoration: none;
    }

    a.back-link:hover { text-decoration: underline; }

    .shop-btn {

      font-size: 1rem;
      text-decoration: none;

    }

      margin: 0;
      color: #666;
      text-align: center;
    }

    .masonry {
      column-count: 3;
      column-gap: 16px;
    }

    figure {
      margin: 0;
      display: inline-block;
      width: 100%;
      margin-bottom: 16px;
      break-inside: avoid;
    }

    figure img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    figure h2 {
      font-size: 0.9rem;
      font-weight: 500;
      margin: 8px 0 2px;
    }

    figure p {
      font-size: 0.8rem;
      color: #888;
      margin: 0;
    }
  </style>
</head>
