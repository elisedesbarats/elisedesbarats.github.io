<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap');

    body {
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 40px;
      background-image: url('assets/clouds2.gif');
      background-repeat: repeat;
      background-size: 100px 100px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      
    }

    a.back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: purple;
      text-decoration: none;
    }

    a.back-link:hover { text-decoration: underline; }

    .header {
      margin-bottom: 32px;
     text-align: center;
    }

    .header h1 {
      font-size: 1.8rem;
      margin: 0 0 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 200px);
      gap: 30px;
      justify-content: center;
    }

    .grid-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
         margin-top: -120px;
        }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: black;
      cursor: pointer;
    }

    .tile-icon {
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .tile-icon img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      overflow: visible;
    }

    .tile-label {
      font-size: 20px;
      text-align: center;
      font-family: "Bitcount Single";
      margin-top: 24px;
    }

    .tile:hover .tile-label {
      background: white;
      color: purple;
    }
  </style>
</head>
<body>

  <a href="index-fun.html" class="back-link" style="font-size: 1.2rem; padding: 8px;">⌂ home</a>

  <div class="header">
    <h1>Projects</h1>
  </div>
<div class="grid-wrap">
  <div class="grid">

    <a href="paintings.html" class="tile">
      <div class="tile-icon">
        <img src="assets/paintings/painting3.jpg" alt="paintings">
      </div>
      <span class="tile-label">Paintings</span>
    </a>

    <a href="#" class="tile">
      <div class="tile-icon">
        <img src="assets/icons/icon1-normal.gif" alt="placeholder">
      </div>
      <span class="tile-label">Placeholder</span>
    </a>

  </div>
  </div>

</body>
</html>
