<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 40px;
      background-image: url('assets/clouds2.gif');
      background-repeat: repeat;
      background-size: 100px 100px;
    }

    a.back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-size: 0.875rem;
      color: purple;
      text-decoration: none;
    }

    a.back-link:hover { text-decoration: underline; }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.8rem;
      margin: 0 0 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 150px);
      gap: 30px;
      justify-content: center;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: black;
      cursor: pointer;
    }

    .tile-icon {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .tile-icon img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .tile-label {
      font-size: 20px;
      text-align: center;
      font-family: "Jacquard 24";
      margin-top: 6px;
    }

    .tile:hover .tile-label {
      background: white;
      color: purple;
    }
  </style>
</head>
<body>

  <a href="index-fun.html" class="back-link">← home</a>

  <div class="header">
    <h1>Projects</h1>
  </div>

  <div class="grid">

    <a href="paintings.html" class="tile">
      <div class="tile-icon">
        <img src="assets/paintings/painting1.jpg" alt="paintings">
      </div>
      <span class="tile-label">Paintings</span>
    </a>

    <a href="#" class="tile">
      <div class="tile-icon">
        <img src="assets/icons/icon1-normal.gif" alt="placeholder">
      </div>
      <span class="tile-label">Placeholder</span>
    </a>

  </div>

</body>
</html>
